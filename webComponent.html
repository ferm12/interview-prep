    let names =['jackson', 'jacques', 'jack'];

    // let result1 = findCompletePrefixes(names, query);

    function findCompletePrefixes(names, queries) {
      let namesString = [];

      for (let i = 0; i < queries.length; i++) {
        let current = i;
        let counter = 0;
        for (let j = 0; j < names.length; j++) {
          // if (names[j].startsWith(queries[current]) && names[j].length > queries[current].length) {
          if (names[j].includes(queries[current]) && names[j] !== queries[current]) {
            counter = counter + 1;
          }
        }
        namesString.push(counter);
      }
      return namesString;
    }

    let result = findCompletePrefixes(names, query);
